<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <h1 class="border-primary pe-5 text-primary">bootstrap</h1>

    <table class="table table-bordered table-hover table-primary table-sm">
        <caption>Tabla 1. Tabla básica</caption>
        <thead class="table-dark">
        <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Ratón</td>
            <td>15</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Teclado</td>
            <td>34</td>
            <td>340</td>
        </tr>
        <tr>
            <td>Pantalla</td>
            <td>10</td>
            <td>400</td>
        </tr>
        </tbody>
    </table>

    <h1>Tabla 2</h1>
    <table class="table table-primary table-bordered">
        <tbody>
            <tr style="height: 200px;">
            <td class="align-middle">Contenido centrado verticalmente</td>
            <td class="align-top">Contenido arriba</td>
            <td class="align-bottom">Contenido abajo</td>
            </tr>
            <tr style="height: 200px;">
            <td class="text-start">Texto alineado a la izquierda</td>
            <td class="text-center">Texto centrado</td>
            <td class="text-end">Texto alineado a la derecha</td>
            </tr>
        </tbody>
    </table>

    <button class="btn">Basic</button>
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-success">Success</button>
    <button class="btn btn-info">Info</button>
    <button class="btn btn-warning">Warning</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-dark">Dark</button>
    <button class="btn btn-light">Light</button>
    <button class="btn btn-link">Link</button>
    <a href="#" class="btn btn-info" role="button">Link Button</a>
    <input type="button" class="btn btn-info" value="Input Button">
    <input type="submit" class="btn btn-info" value="Submit Button">

    <br>

    <div class="btn-group">
    <button type="button" class="btn btn-info">Diseño</button>
    <button type="button" class="btn btn-primary">Desarrollo</button>
    <button type="button" class="btn btn-info">Marketing</button>
    </div>
    <div class="btn-group-vertical">
    <button type="button" class="btn btn-warning">Diseño</button>
    <button type="button" class="btn btn-primary">Desarrollo</button>
    <button type="button" class="btn btn-danger">Marketing</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
